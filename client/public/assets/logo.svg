<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4EDE4"/>
      <stop offset="100%" stop-color="#FFFFFF"/>
    </linearGradient>
    <linearGradient id="duneGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C2703D"/>
      <stop offset="100%" stop-color="#A85A2E"/>
    </linearGradient>
  </defs>

  <!-- background circle -->
  <circle cx="400" cy="400" r="380" fill="url(#skyGrad)" stroke="#C2703D" stroke-width="4"/>

  <!-- inner thin ring -->
  <circle cx="400" cy="400" r="345" fill="none" stroke="#C2703D" stroke-width="1.5" opacity="0.5"/>

  <!-- sun -->
  <circle cx="400" cy="260" r="52" fill="#D98A3D"/>

  <!-- dunes -->
  <path d="M40,470 Q160,400 280,460 Q400,520 520,455 Q640,395 760,460 L760,700 L40,700 Z" fill="url(#duneGrad)"/>
  <path d="M40,520 Q180,460 320,510 Q460,560 600,505 Q680,475 760,510 L760,700 L40,700 Z" fill="#8C4A28" opacity="0.85"/>

  <!-- tent -->
  <g>
    <path d="M400,330 L470,470 L330,470 Z" fill="#2E2A26"/>
    <path d="M400,330 L400,470" stroke="#F4EDE4" stroke-width="3"/>
    <path d="M400,330 L438,470 L362,470 Z" fill="#3E3833"/>
  </g>

  <!-- bird accents -->
  <path d="M250,220 q12,-14 24,0 q12,-14 24,0" stroke="#2E2A26" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M500,200 q10,-12 20,0 q10,-12 20,0" stroke="#2E2A26" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- text -->
  <text x="400" y="590" text-anchor="middle" font-family="'Georgia', serif" font-size="26" letter-spacing="6" fill="#2E2A26">THE</text>
  <text x="400" y="640" text-anchor="middle" font-family="'Georgia', serif" font-weight="bold" font-size="54" fill="#A8391F">KUTCH SAFARI</text>
  <text x="400" y="682" text-anchor="middle" font-family="'Georgia', serif" font-size="30" letter-spacing="10" fill="#2E2A26">RESORT</text>

  <!-- divider -->
  <line x1="300" y1="700" x2="500" y2="700" stroke="#C2703D" stroke-width="2"/>
  <text x="400" y="725" text-anchor="middle" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" letter-spacing="2" fill="#6B5A4E">TENTS • CAMPS • DESERT ESCAPES</text>
</svg>
